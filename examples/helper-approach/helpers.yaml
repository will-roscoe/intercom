# Alternative UI (no custom card): helpers + button-card.
# Put this in configuration.yaml (or a package). Then use script.yaml + card.yaml.
input_text:
  broadcast_message:
    name: Broadcast message
    max: 255
    icon: mdi:message-text

input_number:
  broadcast_volume:
    name: Broadcast volume
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
    icon: mdi:volume-high

input_boolean:
  bcast_spk_living: { name: Living Room, icon: mdi:speaker }
  bcast_spk_tv: { name: Living Room TV, icon: mdi:television }
  bcast_notify_phone: { name: My Phone, icon: mdi:cellphone }
  bcast_notify_tablet: { name: Tablet, icon: mdi:tablet }
  bcast_notify_phone2: { name: Phone 2, icon: mdi:cellphone }
  bcast_notify_tv: { name: Living Room TV (screen), icon: mdi:television }
  bcast_notify_persistent: { name: HA notifications, icon: mdi:bell }
