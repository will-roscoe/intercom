[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "C4",   # flake8-comprehensions
]
ignore = [
  "B008",  # function calls in argument defaults (voluptuous schemas)
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
