<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 429" width="900" height="429">
<style>
svg { font-family: var(--fontStack-sansSerif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif); }
.background { fill: var(--bgColor-default, #0d1117); }
.text { fill: var(--fgColor-default, var(--color-fg-default, #f6f8fa)); }
.muted { fill: var(--color-prettylights-syntax-comment, #656d76); }
.card { fill: var(--bgColor-muted, var(--color-canvas-subtle, #151b23)); }
.mono { font-family: var(--fontStack-monospace, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace); }
.title { font-size: 2em; font-weight: 600; }
.subtitle { font-size: 16px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; }
.value { font-size: 22px; font-weight: 500; }
.small { font-size: 13px; }
.link { fill: var(--fgColor-accent, var(--color-accent-fg, #0969da)); text-decoration: underline; }
.pass { fill: var(--bgColor-success-emphasis, #1a7f37); }
.fail { fill: var(--bgColor-danger-emphasis, #cf222e); }
.warn { fill: var(--bgColor-attention-emphasis, #9a6700); }
.ok { fill: var(--bgColor-success-emphasis, #1a7f37); }
</style>
<rect class="background" x="1" y="1" width="898" height="427" rx="14"/>
<image x="35" y="20" width="80" height="80" href="data:image/svg+xml;base64,"/>
<text class="title text" x="130" y="55">intercom</text>
<text class="subtitle muted" x="130" y="90">
<tspan x="130">Broadcast TTS announcements over your Home Assistant media</tspan>
<tspan x="130" dy="18">players and notify your devices — one service and one</tspan>
<tspan x="130" dy="18">Lovelace card.</tspan>
</text>
<text class="value text" x="865" y="55" text-anchor="end">v0.4.0</text>
<text class="label muted" x="35" y="171">QUALITY</text>
<rect class="card" x="35" y="189" width="190" height="90" rx="10"/>
<text class="label mono pass" x="50" y="214">TESTS</text>
<text class="value text" x="50" y="246">✓ 80</text>
<text class="small mono muted" x="50" y="266">0 failed · 0 skipped</text>
<rect class="card" x="245" y="189" width="190" height="90" rx="10"/>
<text class="label mono pass" x="260" y="214">LINT</text>
<text class="value text" x="260" y="246">✓ Clean</text>
<text class="small mono muted" x="260" y="266">ruff, ruff-format</text>
<text class="label muted" x="35" y="319">PYTHON SUPPORT</text>
<text class="small text" x="45" y="349" text-anchor="middle">3.13</text>
<circle cx="45" cy="374" r="8" class="pass"/>
<text class="label muted" x="225" y="319">BUILDS</text>
<text class="small muted" x="225" y="369">x86_64</text>
<text class="small text" x="315" y="347" text-anchor="middle">Linux</text>
<circle cx="315" cy="365" r="6" class="pass"/>
</svg>
