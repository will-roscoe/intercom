name: Release

# Releases are driven by the version in manifest.json: bump it in a PR, and
# merging that PR publishes the release. Pushing a v* tag by hand still works.
#
# Note the tag is created *by this workflow* rather than pushed separately. A
# tag pushed using GITHUB_TOKEN does not trigger other workflows (GitHub
# suppresses that to avoid recursion), so a "tag now, release on the tag" chain
# would never fire. Doing both in one job avoids that trap entirely.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Resolve the version to release
        id: version
        run: |
          MANIFEST=$(python -c "import json;print(json.load(open('custom_components/intercom/manifest.json'))['version'])")
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "tag=v$MANIFEST" >> "$GITHUB_OUTPUT"
          # A hand-pushed tag must agree with the manifest, or the release would
          # be named one thing and contain another.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$MANIFEST" ]; then
            echo "::error::Tag (${GITHUB_REF_NAME#v}) does not match manifest version ($MANIFEST)"
            exit 1
          fi
          echo "releasing v$MANIFEST"

      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.version.outputs.tag }} is already released; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # An automated release must not be able to ship code the checks reject,
      # so re-run them here rather than trusting that they passed elsewhere.
      - name: Install check dependencies
        if: steps.check.outputs.exists == 'false'
        run: pip install ruff pytest pyyaml voluptuous

      - name: Lint
        if: steps.check.outputs.exists == 'false'
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        if: steps.check.outputs.exists == 'false'
        run: pytest -q

      - name: Create zip
        if: steps.check.outputs.exists == 'false'
        run: |
          cd custom_components/intercom
          zip -r ../../intercom.zip .

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: intercom.zip
