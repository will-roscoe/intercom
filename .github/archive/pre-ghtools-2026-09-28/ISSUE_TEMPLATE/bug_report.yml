name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.5.4"
    validations:
      required: true
  - type: input
    id: intercom_version
    attributes:
      label: Intercom version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: players
    attributes:
      label: Players / notify targets involved
      description: Which media_player and notify entities were targeted?
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Settings → System → Logs, filtered to "intercom".
      render: text
